# Blueprint do Render: sistema + sincronização com a API do Clinicorp, com disco persistente para o banco.
services:
  - type: web
    name: exclusive-odontologia
    runtime: node
    rootDir: clinica-crm
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLINICORP_USER
        sync: false
      - key: CLINICORP_TOKEN
        sync: false
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
